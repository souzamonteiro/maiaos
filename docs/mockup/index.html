<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaiaOS Web Simulator</title><style>
:root{font-family:Arial,sans-serif;color:#e8f3fa;background:#0b111a}*{box-sizing:border-box}body{margin:0;padding:18px}.device{max-width:1200px;margin:auto;border:3px solid #465c6b;border-radius:30px;padding:20px;background:#1e2834;box-shadow:0 20px 70px #0008}.device-head{display:flex;justify-content:space-between;color:#aebdcc;letter-spacing:2px;margin-bottom:14px}.screen{position:relative;aspect-ratio:16/9;overflow:hidden;border:6px solid #526879;border-radius:19px;background:#102333}.screen canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.keyboard{margin-top:16px;background:#313c48;border-radius:22px;padding:12px;display:none}.keyboard.visible{display:block}.keyrow{display:flex;justify-content:center;gap:5px;margin:5px 0}.key{flex:1;min-width:0;padding:11px 2px;border:1px solid #8292a1;border-radius:7px;background:#536272;color:white;cursor:pointer;font-size:clamp(9px,1.3vw,15px)}.key.wide{flex:2}.key.space{flex:5}.controls{max-width:1200px;margin:12px auto;display:flex;flex-wrap:wrap;gap:9px;align-items:center}.controls button,.controls select{background:#1e3448;border:1px solid #58728b;border-radius:8px;color:white;padding:9px 13px;cursor:pointer}.controls button:hover{background:#285678}.hint{color:#a6b7c5;font-size:13px}.footer{max-width:1200px;margin:10px auto;color:#8eabbc;font-size:12px}.kbdstatus{margin-left:auto;color:#84dec2}@media(max-width:700px){body{padding:5px}.device{padding:8px;border-radius:15px}.device-head{font-size:10px}.key{padding:7px 0}.controls{gap:4px}.controls button{padding:6px}.hint{display:none}}</style></head><body>
<div class="controls"><strong>◈ MaiaOS Simulator</strong><button id="power">⏻ Reset</button><button id="toggleKeyboard">⌨ Keyboard</button><button id="screenshot">▣ Screenshot</button><button id="mount">▣ SD: Mounted</button><span class="hint">Click icons or type in Terminal • Esc closes a window • Drag title bars</span><span class="kbdstatus" id="status">Ready</span></div>
<div class="device"><div class="device-head"><span>M5STACK · TAB5</span><span>ESP32-P4 · SIMULATOR</span></div><div class="screen"><canvas id="display" width="1280" height="720" tabindex="0" aria-label="MaiaOS simulated touchscreen"></canvas></div><div class="keyboard" id="keyboard"></div></div><div class="footer">MaiaOS Web Simulator v0.1 · Canvas backend (MaiaGFX prototype) · Browser WASM reference runtime · Simulated device, not ESP32 firmware</div>
<script>
'use strict';
const canvas=document.getElementById('display'),ctx=canvas.getContext('2d');
const W=1280,H=720;let selected='Terminal',active='Terminal',sdMounted=true,keyboardVisible=false,drag=null,hit=[],terminalInput='',terminalLines=['MaiaOS Web Simulator · ES8 / Canvas backend','Type help for available commands.','maia@tab5:~$ '],files={'/apps':['hello.wasm','terminal.wasm','files.wasm','editor.wasm','monitor.wasm'],'/home':['readme.txt'],'/system':['init.wasm'],'/config':['maiaos.json']},currentDir='/home';
const apps=[['Terminal','>_'],['Files','▣'],['Editor','</>'],['Settings','⚙'],['Monitor','▥'],['Calculator','▦'],['Apps','◇'],['Shell','$_']];
const windows={Terminal:{x:290,y:258,w:700,h:335,open:true},Files:{x:120,y:215,w:690,h:400,open:false},Editor:{x:220,y:175,w:750,h:460,open:false},Settings:{x:370,y:185,w:550,h:410,open:false},Monitor:{x:755,y:210,w:410,h:340,open:false},Calculator:{x:465,y:220,w:340,h:380,open:false},Apps:{x:260,y:190,w:650,h:400,open:false},Shell:{x:340,y:260,w:630,h:320,open:false}};
let zOrder=['Terminal'],editorText='#include <maiaos.h>\n\nint main(void) {\n    maia_print("Hello MaiaOS!");\n    return 0;\n}',calc='0';
function rect(x,y,w,h,fill,r=0,stroke=null){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function txt(s,x,y,size=20,color='#eaf4fb',font='Arial',align='left'){ctx.fillStyle=color;ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.fillText(String(s),x,y);ctx.textAlign='left'}
function target(x,y,w,h,fn){hit.push({x,y,w,h,fn})}
function wallpaper(){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a2744');g.addColorStop(.55,'#153a58');g.addColorStop(1,'#3b354d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#21445c';for(let i=0;i<13;i++){ctx.beginPath();ctx.moveTo(i*110,630);ctx.lineTo(i*110+55,555+(i%4)*17);ctx.lineTo(i*110+130,630);ctx.fill()}ctx.fillStyle='#e4a36b';ctx.beginPath();ctx.arc(1100,430,68,0,Math.PI*2);ctx.fill();rect(1070,395,55,170,'#d1d9d7',6);rect(1060,380,75,25,'#243a4e',3);rect(1080,366,35,18,'#f7d58d',4)}
function openApp(a){windows[a].open=true;zOrder=zOrder.filter(n=>n!==a);zOrder.push(a);active=a;draw()}
function windowFrame(name,p){rect(p.x+6,p.y+9,p.w,p.h,'#0008',12);rect(p.x,p.y,p.w,p.h,'#0c1d2beF',12,'#7892a4');rect(p.x,p.y,p.w,44,'#24394d',10);txt(name==='Terminal'?'▣ Maia Terminal':'▣ '+name,p.x+17,p.y+29,20);txt('—',p.x+p.w-82,p.y+29,24,'#c4d9e8');txt('×',p.x+p.w-34,p.y+30,28,'#ff9696');target(p.x+p.w-55,p.y,55,44,()=>{p.open=false;draw()});target(p.x,p.y,p.w-95,44,()=>{});ctx.save();ctx.beginPath();ctx.rect(p.x+8,p.y+48,p.w-16,p.h-57);ctx.clip()}
function terminalBody(p){let y=p.y+79;const lineHeight=26;for(const line of terminalLines.slice(-Math.floor((p.h-95)/lineHeight))){txt(line,p.x+20,y,19,line.includes('maia@')?'#76dfb2':'#d7e5ef','monospace');y+=lineHeight}txt('maia@tab5:~$ '+terminalInput+'▌',p.x+20,Math.min(p.y+p.h-19,y+4),18,'#82e5b7','monospace')}
function bodyFor(name,p){if(name==='Terminal'||name==='Shell')terminalBody(p);else if(name==='Files'||name==='Apps'){txt('◀    ▶    /apps',p.x+22,p.y+84,22,'#b8d8f1');(files['/apps']||[]).forEach((f,i)=>{let xx=p.x+24+(i%4)*155,yy=p.y+110+Math.floor(i/4)*105;rect(xx,yy,125,87,'#243b50',9);txt('▣',xx+47,yy+45,33,'#8bcbff');txt(f.replace('.wasm',''),xx+62,yy+71,14,'#dcecf5','Arial','center');target(xx,yy,125,87,()=>{if(f==='hello.wasm')runCommand('maia run /apps/hello.wasm');else openApp(f.split('.')[0].charAt(0).toUpperCase()+f.split('.')[0].slice(1))})})}else if(name==='Editor'){editorText.split('\n').forEach((line,i)=>txt(String(i+1).padStart(2)+'  '+line,p.x+18,p.y+86+i*27,18,'#a5d6ef','monospace'));txt('Read-only preview • Local editing is a later milestone',p.x+18,p.y+p.h-20,15,'#91aab9')}else if(name==='Settings'){txt('Display',p.x+25,p.y+90,24);txt('Brightness  ━━━━━●━━━━',p.x+25,p.y+145,22);txt('Theme: Dark',p.x+25,p.y+205,22);txt('Input: Touch + Keyboard',p.x+25,p.y+265,22);txt('Storage: '+(sdMounted?'SD mounted':'SD unmounted'),p.x+25,p.y+325,22)}else if(name==='Monitor'){['CPU (simulated)      12%','Memory (simulated)   128 MB / 512 MB','Storage (virtual)   1.2 GB / 8 GB','Runtime: Browser WebAssembly'].forEach((s,i)=>{txt(s,p.x+22,p.y+93+i*58,18);rect(p.x+22,p.y+103+i*58,p.w-48,8,'#263b50',5);rect(p.x+22,p.y+103+i*58,(p.w-48)*(.14+i*.12),8,i===2?'#eab04f':'#30b6a5',5)})}else if(name==='Calculator'){txt(calc,p.x+p.w-30,p.y+105,36,'#a6f2c8','monospace','right');'789/456*123-0.C+'.split('').forEach((v,i)=>{if(v==='.')return;let xx=p.x+24+(i%4)*75,yy=p.y+132+Math.floor(i/4)*48;rect(xx,yy,64,40,'#31495e',7);txt(v,xx+32,yy+27,22,'#e6f4ff','Arial','center');target(xx,yy,64,40,()=>{calc=v==='C'?'0':calc==='0'?v:calc+v;draw()})})}}
function draw(){hit=[];wallpaper();rect(0,0,W,55,'#071928eE');txt('◈ MaiaOS',25,37,31,'#83e5c4');txt('◉ Wi-Fi     ◈ BT     ▣ SD '+(sdMounted?'●':'○')+'     '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),W-25,35,19,'#d5e6f2','Arial','right');rect(0,55,125,H-110,'#081927c9');[['Home','⌂'],['Apps','▦'],['Files','▣'],['Settings','⚙'],['Monitor','▥']].forEach(([a,ic],i)=>{let y=80+i*110;rect(10,y,104,90,a===selected?'#1760a8':'#18334b',10);txt(ic,62,y+43,32,'#99e4d1','Arial','center');txt(a,62,y+70,16,'#e4eef8','Arial','center');target(10,y,104,90,()=>{selected=a;if(a!=='Home')openApp(a);else draw()})});apps.forEach(([name,ic],i)=>{let x=170+(i%4)*195,y=96+Math.floor(i/4)*125;rect(x,y,151,103,'#203f55c9',15);txt(ic,x+75,y+51,35,'#9ce8cf','Arial','center');txt(name,x+75,y+82,18,'#f0f7fb','Arial','center');target(x,y,151,103,()=>openApp(name))});for(const name of zOrder){let p=windows[name];if(!p.open)continue;windowFrame(name,p);bodyFor(name,p);ctx.restore()}rect(125,H-50,W-125,50,'#071725eF');txt('▦',148,H-16,26,'#b7e4f7');txt('Terminal     Files     Editor     Settings',210,H-17,17,'#d9ebf8');txt('MaiaWASM · Web Host    |    1280 × 720',W-20,H-17,16,'#9bb7c9','Arial','right');}
function runCommand(command){terminalLines.push('maia@tab5:~$ '+command);const parts=command.trim().split(/\s+/),cmd=parts[0];if(cmd==='help')terminalLines.push('help  ls  pwd  cd  cat  clear  echo  date  ps  maia run');else if(cmd==='ls')terminalLines.push((files[parts[1]||currentDir]||[]).join('    ')||'No files or directory not found');else if(cmd==='pwd')terminalLines.push(currentDir);else if(cmd==='cd'){currentDir=parts[1]||'/home';terminalLines.push('Directory: '+currentDir)}else if(cmd==='echo')terminalLines.push(parts.slice(1).join(' '));else if(cmd==='date')terminalLines.push(new Date().toString());else if(cmd==='ps')terminalLines.push('1 init   2 windowd   3 shell   4 terminal');else if(cmd==='clear')terminalLines=[];else if(cmd==='cat')terminalLines.push(parts[1]==='/home/readme.txt'?'Welcome to MaiaOS.':'File unavailable');else if(cmd==='maia'&&parts[1]==='run'){if((parts[2]||'').endsWith('hello.wasm')){const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,7,1,3,114,117,110,0,0,10,6,1,4,0,65,42,11]);try{const module=new WebAssembly.Module(bytes);const instance=new WebAssembly.Instance(module);terminalLines.push('Hello from MaiaOS! (WASM result: '+instance.exports.run()+')')}catch(e){terminalLines.push('WASM error: '+e.message)}}else terminalLines.push('Demo only: hello.wasm is supported')}else if(command.trim())terminalLines.push('Unknown command: '+cmd);terminalInput='';openApp('Terminal')}
function pos(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
canvas.addEventListener('pointerdown',e=>{canvas.focus();const p=pos(e);for(let i=zOrder.length-1;i>=0;i--){const name=zOrder[i],w=windows[name];if(w.open&&p.x>=w.x&&p.x<=w.x+w.w&&p.y>=w.y&&p.y<=w.y+w.h){if(p.y<w.y+44){if(p.x>w.x+w.w-55){w.open=false;draw();return}drag={name,dx:p.x-w.x,dy:p.y-w.y};canvas.setPointerCapture(e.pointerId)}zOrder.splice(i,1);zOrder.push(name);active=name;break}}for(let i=hit.length-1;i>=0;i--){let h=hit[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();break}}draw()});canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e),w=windows[drag.name];w.x=Math.max(125,Math.min(W-w.w,p.x-drag.dx));w.y=Math.max(55,Math.min(H-w.h-50,p.y-drag.dy));draw()});canvas.addEventListener('pointerup',()=>drag=null);
function keyInput(k){if(k==='Enter'){runCommand(terminalInput);return}if(k==='Backspace'){terminalInput=terminalInput.slice(0,-1)}else if(k==='Escape'){if(windows[active])windows[active].open=false}else if(k==='Space')terminalInput+=' ';else if(k.length===1)terminalInput+=k;draw()}
window.addEventListener('keydown',e=>{if(e.target!==canvas)return;if(['Enter','Backspace','Escape',' '].includes(e.key)||e.key.length===1){e.preventDefault();keyInput(e.key===' '?'Space':e.key)}});
const rows=[['Esc','1','2','3','4','5','6','7','8','9','0','Backspace'],['Tab',...'QWERTYUIOP'.split(''),'Enter'],['Caps',...'ASDFGHJKL'.split('')],['Shift',...'ZXCVBNM'.split(''),'↑'],['Ctrl','Alt','Space','←','↓','→']];const kb=document.getElementById('keyboard');for(const row of rows){let d=document.createElement('div');d.className='keyrow';for(const k of row){let b=document.createElement('button');b.className='key'+(k==='Space'?' space':['Enter','Shift','Backspace'].includes(k)?' wide':'');b.textContent=k;b.onclick=()=>{keyInput(k.length===1?k.toLowerCase():k);canvas.focus()};d.appendChild(b)}kb.appendChild(d)}document.getElementById('toggleKeyboard').onclick=()=>{keyboardVisible=!keyboardVisible;kb.classList.toggle('visible',keyboardVisible)};document.getElementById('mount').onclick=e=>{sdMounted=!sdMounted;e.target.textContent='▣ SD: '+(sdMounted?'Mounted':'Ejected');draw()};document.getElementById('power').onclick=()=>{terminalLines=['MaiaOS restarted.','Type help for available commands.'];terminalInput='';Object.keys(windows).forEach(k=>windows[k].open=false);openApp('Terminal')};document.getElementById('screenshot').onclick=()=>{let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='maiaos-simulator.png';a.click()};draw();canvas.focus();
</script></body></html>
